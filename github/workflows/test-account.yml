name: Login Account (Autologin)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte"
        required: true
        type: string
      password:
        description: "Mot de passe"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: freetron, tronpick, litepick...)"
        required: true
        type: string
      userId:
        description: "USER_ID"
        required: true
        type: string
      proxyIndex:
        description: "Index du proxy (0, 1, 2...)"
        required: false
        type: string
        default: "0"
      initialTimer:
        description: "Timer initial (ex: 60:00)"
        required: false
        type: string
        default: "60:00"

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: ghcr.io/aliya123-pro/camoufox-system:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 1. Masque le mot de passe dans les logs
      - name: Masquer le mot de passe
        env:
          MASK_PASSWORD: ${{ github.event.inputs.password }}
        run: echo "::add-mask::$MASK_PASSWORD"

      # 2. Récupère le code depuis le dépôt PRIVÉ
      - name: Checkout du dépôt privé
        uses: actions/checkout@v4
        with:
          repository: TON_USERNAME/Aliyas-private   # ← CHANGE ICI (ex: aliya123/Aliyas-private)
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code
          ref: main

      # 3. Copie le code dans le conteneur et lance l'autologin
      - name: Exécuter l'autologin
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: ${{ github.event.inputs.password }}
          TEST_PLATFORM: ${{ github.event.inputs.platform }}
          TEST_PROXY_INDEX: ${{ github.event.inputs.proxyIndex || '0' }}
          TEST_INITIAL_TIMER: ${{ github.event.inputs.initialTimer || '60:00' }}
          USER_ID: ${{ github.event.inputs.userId }}
          # ← Important : on pointe vers le dépôt PRIVÉ
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_USERNAME: TON_USERNAME                  # ← CHANGE ICI
          GH_REPO: Aliyas-private                   # ← CHANGE ICI (nom du dépôt privé)
          GH_BRANCH: main
          JP_PROXY_LIST: ${{ secrets.JP_PROXY_LIST }}
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: |
          # On copie tout le code privé dans /app
          cp -r $GITHUB_WORKSPACE/private-code/* /app/
          mkdir -p /app/videos /app/screenshots
          xvfb-run --auto-servernum python test_login_workflow.py

      # 4. Upload de la vidéo (même en cas d'échec)
      - name: Upload des vidéos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-video-${{ github.run_id }}
          path: /app/videos/
          retention-days: 3
          if-no-files-found: warn
